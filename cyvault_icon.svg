    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M512 218 L769 332 L769 554 Q769 703 512 829 Q255 703 255 554 L255 332 Z" fill="url(#shieldGrad)"/>
  <path d="M512 218 L769 332 L769 554 Q769 703 512 829 Q255 703 255 554 L255 332 Z"
