  <path d="M1030 501 L1030 517" class="dep"/>
  <path d="M1030 553 L1030 569" class="dep"/>
  <text x="1040" y="565" class="t-small">unwraps</text>
  <path d="M1030 605 L1030 621" class="dep"/>
  <path d="M1030 657 L1030 673" class="dep"/>

  <rect x="1165" y="512" width="200" height="44" rx="8" class="box" stroke="#7C3AED"/>
  <text x="1265" y="530" class="t-box">HKDF → auth hash</text>
  <text x="1265" y="546" class="t-boxsub">sent to Cognito — never the master pw</text>
  <path d="M1132 535 L1162 535" class="dep"/>

  <rect x="1165" y="590" width="200" height="44" rx="8" class="box" stroke="#7C3AED"/>
  <text x="1265" y="608" class="t-box">Keystore / Keychain key</text>
  <text x="1265" y="624" class="t-boxsub">biometric-gated · also wraps vault key</text>
  <path d="M1163 605 L1133 592" class="dep"/>

  <rect x="1165" y="662" width="200" height="48" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="1265" y="680" class="t-box">Stored: server + local DB</text>
  <text x="1265" y="697" class="t-boxsub">salt · KDF params · wrapped key · ciphertext</text>
  <path d="M1132 691 L1162 688" class="dep"/>

  <!-- ===================== RIGHT C: DATA FLOW ===================== -->
  <rect x="900" y="735" width="480" height="270" rx="10" class="panel"/>
  <text x="916" y="760" class="t-panel">Offline-first data flow (data:vault)</text>

  <rect x="920" y="778" width="120" height="40" rx="8" class="box" stroke="#2563EB"/>
  <text x="980" y="803" class="t-box">UI</text>
