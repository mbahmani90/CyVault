  <text x="52" y="292" class="t-band">FEATURE:*  —  UI + VIEWMODELS (MVI)</text>
  <rect x="60" y="300" width="140" height="50" rx="8" class="box" stroke="#2563EB"/>
  <text x="130" y="321" class="t-box">auth</text>
  <text x="130" y="338" class="t-boxsub">login · register · Google</text>
  <rect x="215" y="300" width="140" height="50" rx="8" class="box" stroke="#2563EB"/>
  <text x="285" y="321" class="t-box">unlock</text>
  <text x="285" y="338" class="t-boxsub">master pw · biometrics</text>
  <rect x="370" y="300" width="140" height="50" rx="8" class="box" stroke="#2563EB"/>
  <text x="440" y="321" class="t-box">vault</text>
  <text x="440" y="338" class="t-boxsub">list · detail · edit</text>
  <rect x="525" y="300" width="140" height="50" rx="8" class="box" stroke="#2563EB"/>
  <text x="595" y="321" class="t-box">generator</text>
  <text x="595" y="338" class="t-boxsub">password generator</text>
  <rect x="680" y="300" width="140" height="50" rx="8" class="box" stroke="#2563EB"/>
  <text x="750" y="321" class="t-box">settings</text>
  <text x="750" y="338" class="t-boxsub">auto-lock · sign out</text>

  <path d="M440 239 L440 297" class="dep"/>
  <text x="448" y="268" class="t-small">wires nav graphs</text>

  <!-- Band: domain -->
  <rect x="40" y="395" width="810" height="90" rx="10" fill="#E3F6E8" stroke="#22C55E"/>
  <text x="52" y="412" class="t-band">DOMAIN  —  PURE KOTLIN</text>
  <rect x="250" y="410" width="380" height="60" rx="8" class="box" stroke="#16A34A"/>
  <text x="440" y="430" class="t-box">domain</text>
  <text x="440" y="447" class="t-boxsub">models · repository interfaces · use cases</text>
  <text x="440" y="461" class="t-boxsub">SessionState · SessionManager · KeyManager (interfaces)</text>

  <path d="M130 352 L290 407" class="dep"/>
  <path d="M440 352 L440 407" class="dep"/>
  <path d="M595 352 L585 407" class="dep"/>

  <!-- Forbidden: feature -> data -->
  <path d="M760 352 L760 531" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowRed)"/>
  <circle cx="760" cy="442" r="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
  <text x="760" y="447" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">✕</text>
  <text x="742" y="446" font-size="11" font-weight="700" fill="#DC2626" text-anchor="end">forbidden</text>

  <!-- Band: data -->
  <rect x="40" y="510" width="810" height="95" rx="10" fill="#FFF1DC" stroke="#F59E0B"/>
  <text x="52" y="527" class="t-band">DATA:*  —  IMPLEMENTS DOMAIN INTERFACES</text>
  <rect x="70" y="535" width="170" height="50" rx="8" class="box" stroke="#D97706"/>
  <text x="155" y="556" class="t-box">auth</text>
  <text x="155" y="573" class="t-boxsub">Amplify / IosAuthBridge</text>
  <rect x="260" y="535" width="170" height="50" rx="8" class="box" stroke="#D97706"/>
  <text x="345" y="556" class="t-box">session</text>
  <text x="345" y="573" class="t-boxsub">lock state · auto-lock timer</text>
  <rect x="450" y="535" width="170" height="50" rx="8" class="box" stroke="#D97706"/>
  <text x="535" y="556" class="t-box">vault</text>
  <text x="535" y="573" class="t-boxsub">offline-first + sync</text>
  <rect x="640" y="535" width="170" height="50" rx="8" class="box" stroke="#D97706"/>
  <text x="725" y="556" class="t-box">keys</text>
  <text x="725" y="573" class="t-boxsub">derive · wrap · unwrap vault key</text>

  <path d="M345 533 L380 473" class="dep"/>
  <path d="M535 533 L500 473" class="dep"/>
  <text x="448" y="503" class="t-small">implements</text>

  <!-- app -> data (side route) -->
  <path d="M582 215 H868 V560 H813" class="dep"/>
  <text x="882" y="400" class="t-small" transform="rotate(90 882 400)" text-anchor="middle">app registers data impls in Koin</text>

  <!-- Band: core -->
  <rect x="40" y="630" width="810" height="95" rx="10" fill="#EEEEF0" stroke="#94A3B8"/>
  <text x="52" y="647" class="t-band">CORE:*  —  TECHNICAL, NO BUSINESS LOGIC</text>
  <rect x="55" y="655" width="108" height="50" rx="8" class="box" stroke="#64748B"/>
  <text x="109" y="676" class="t-box">designsystem</text>
  <text x="109" y="693" class="t-boxsub">theme · SecureScreen</text>
  <rect x="167" y="655" width="108" height="50" rx="8" class="box" stroke="#64748B"/>
  <text x="221" y="676" class="t-box">common</text>
  <text x="221" y="693" class="t-boxsub">Clock · AppError</text>
  <rect x="279" y="655" width="108" height="50" rx="8" class="box" stroke="#64748B"/>
  <text x="333" y="676" class="t-box">crypto</text>
  <text x="333" y="693" class="t-boxsub">Argon2id · AES-GCM</text>
  <rect x="391" y="655" width="108" height="50" rx="8" class="box" stroke="#64748B"/>
  <text x="445" y="676" class="t-box">securestorage</text>
  <text x="445" y="693" class="t-boxsub">Keystore · Keychain</text>
  <rect x="503" y="655" width="108" height="50" rx="8" class="box" stroke="#64748B"/>
  <text x="557" y="676" class="t-box">database</text>
  <text x="557" y="693" class="t-boxsub">SQLDelight · encrypted</text>
  <rect x="615" y="655" width="108" height="50" rx="8" class="box" stroke="#64748B"/>
  <text x="669" y="676" class="t-box">network</text>
  <text x="669" y="693" class="t-boxsub">Ktor · TLS pinning</text>
  <rect x="727" y="655" width="108" height="50" rx="8" class="box" stroke="#64748B" stroke-dasharray="5 4"/>
  <text x="781" y="676" class="t-box">testing</text>
  <text x="781" y="693" class="t-boxsub">fakes · test rules</text>

  <path d="M345 587 L335 652" class="dep"/>
  <path d="M535 587 L555 652" class="dep"/>
  <path d="M725 587 L670 652" class="dep"/>
  <text x="575" y="625" class="t-small">uses</text>

  <!-- features -> designsystem/common (left route) -->
  <path d="M58 325 H28 V680 H52" class="dep"/>
  <text x="18" y="500" class="t-small" transform="rotate(-90 18 500)" text-anchor="middle">features use designsystem + common only</text>

  <!-- Rules + legend -->
  <rect x="40" y="750" width="810" height="255" rx="10" class="panel"/>
  <text x="56" y="778" class="t-panel">Dependency rules · enforced in CI (module-graph assertion)</text>
  <text x="56" y="806" class="t-rule"><tspan fill="#16A34A" font-weight="700">✓</tspan>  feature:*  →  domain, core:designsystem, core:common</text>
  <text x="56" y="830" class="t-rule"><tspan fill="#16A34A" font-weight="700">✓</tspan>  data:*  →  domain + technical core:* (crypto, securestorage, database, network)</text>
  <text x="56" y="854" class="t-rule"><tspan fill="#16A34A" font-weight="700">✓</tspan>  app  →  everything (the only composition root: Koin modules + navigation graphs)</text>
  <text x="56" y="878" class="t-rule"><tspan fill="#DC2626" font-weight="700">✕</tspan>  feature → data   ·   feature → feature   ·   core → domain / data / feature</text>

  <line x1="56" y1="912" x2="96" y2="912" class="dep"/>
  <text x="104" y="916" class="t-small">depends on</text>
  <line x1="196" y1="912" x2="236" y2="912" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="244" y="916" class="t-small">forbidden</text>
  <line x1="326" y1="912" x2="366" y2="912" class="back"/>
  <text x="374" y="916" class="t-small">session transition</text>
  <rect x="488" y="902" width="34" height="20" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="5 4"/>
  <text x="530" y="916" class="t-small">test-only module</text>

  <text x="56" y="952" class="t-rule"><tspan font-weight="700">Principles:</tspan>  zero-knowledge (server and local DB hold ciphertext only)  ·  session state drives navigation</text>
  <text x="56" y="974" class="t-rule">·  data + crypto work without UI, so Android Autofill / iOS Credential Provider can reuse them</text>
  <text x="56" y="996" class="t-small">Convention plugins in build-logic/ give every module type the same Gradle setup.</text>

  <!-- ===================== RIGHT A: NAVIGATION ===================== -->
  <rect x="900" y="55" width="480" height="305" rx="10" class="panel"/>
  <text x="916" y="80" class="t-panel">Session-driven navigation</text>

  <rect x="920" y="95" width="440" height="34" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1140" y="117" class="t-box">SessionManager.state : StateFlow&lt;SessionState&gt;</text>
  <path d="M1010 131 L1010 148" class="dep"/>

  <rect x="935" y="150" width="150" height="40" rx="20" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
