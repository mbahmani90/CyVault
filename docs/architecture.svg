  <text x="52" y="197" class="t-band">COMPOSITION ROOT</text>
  <rect x="300" y="193" width="280" height="44" rx="8" class="box" stroke="#7C3AED"/>
  <text x="440" y="211" class="t-box">app</text>
  <text x="440" y="227" class="t-boxsub">Koin startup · root NavHost driven by SessionState</text>

  <path d="M315 146 L385 191" class="dep"/>
  <path d="M565 146 L495 191" class="dep"/>

  <!-- Band: features -->
