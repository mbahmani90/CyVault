  <path d="M935 296 H921 V235 H932" class="back"/>
  <path d="M935 308 H908 V170 H932" class="back"/>

  <rect x="1180" y="150" width="185" height="40" rx="8" class="box" stroke="#2563EB"/>
  <text x="1272" y="167" class="t-box">authGraph</text>
  <text x="1272" y="182" class="t-boxsub">login · register · verify</text>
  <rect x="1180" y="215" width="185" height="40" rx="8" class="box" stroke="#2563EB"/>
  <text x="1272" y="232" class="t-box">unlockGraph</text>
  <text x="1272" y="247" class="t-boxsub">master password · biometrics</text>
  <rect x="1180" y="280" width="185" height="40" rx="8" class="box" stroke="#2563EB"/>
  <text x="1272" y="297" class="t-box">vaultGraph</text>
  <text x="1272" y="312" class="t-boxsub">+ settings · generator</text>

  <path d="M1087 170 L1177 170" class="dep"/>
  <path d="M1087 235 L1177 235" class="dep"/>
  <path d="M1087 300 L1177 300" class="dep"/>
  <text x="1132" y="164" class="t-small" text-anchor="middle">root graph</text>

  <text x="916" y="345" class="t-small"><tspan fill="#D97706" font-weight="700">↺</tspan> auto-lock / background → Locked</text>
  <text x="1130" y="345" class="t-small"><tspan fill="#D97706" font-weight="700">↺</tspan> sign out / token expiry → SignedOut</text>

  <!-- ===================== RIGHT B: KEY HIERARCHY ===================== -->
  <rect x="900" y="375" width="480" height="345" rx="10" class="panel"/>
  <text x="916" y="400" class="t-panel">Key hierarchy (zero-knowledge)</text>

  <rect x="930" y="415" width="200" height="32" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="1030" y="436" class="t-box">Master password</text>
  <rect x="930" y="467" width="200" height="32" rx="16" fill="#FFFFFF" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="488" font-size="12" fill="#0F172A" text-anchor="middle">Argon2id · salt · memory-hard</text>
  <rect x="930" y="519" width="200" height="32" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1030" y="540" class="t-box">Master key (RAM only)</text>
  <rect x="930" y="571" width="200" height="32" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1030" y="592" class="t-box">Vault key · random 256-bit</text>
  <rect x="930" y="623" width="200" height="32" rx="16" fill="#FFFFFF" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="644" font-size="12" fill="#0F172A" text-anchor="middle">AES-256-GCM · nonce per item</text>
  <rect x="930" y="675" width="200" height="32" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1030" y="696" class="t-box">Encrypted VaultItems</text>

